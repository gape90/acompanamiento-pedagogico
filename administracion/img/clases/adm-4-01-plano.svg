<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" font-family="'Plus Jakarta Sans', system-ui, sans-serif" aria-label="Plano del liderazgo situacional. El eje horizontal es cuánto dirige quien lidera y el vertical, cuánto apoya. 1 Dirigir: mucha dirección y poco apoyo. 2 Entrenar: mucha dirección y mucho apoyo. 3 Apoyar: poca dirección y mucho apoyo. 4 Delegar: poca dirección y poco apoyo. Una flecha en el centro muestra el orden en que se pasa de un estilo a otro mientras la persona aprende la tarea."><defs><filter id="sombra" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B1A4A" flood-opacity=".10"/></filter><linearGradient id="ejeg" x1="0" x2="1"><stop offset="0" stop-color="#5B2A86" stop-opacity=".25"/><stop offset="1" stop-color="#5B2A86"/></linearGradient><linearGradient id="ejegv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B2A86" stop-opacity=".25"/><stop offset="1" stop-color="#5B2A86"/></linearGradient><marker id="pu" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs><rect width="1000" height="610" rx="24" fill="#F7F4FD"/><g class="a-ap" style="--d:0s"><rect x="121" y="32" width="6" height="504" rx="3" fill="url(#ejegv)"/><path d="M114 38 L124 22 L134 38z" fill="#5B2A86"/><text transform="translate(110 280.0) rotate(-90)" font-size="17" font-weight="800" fill="#5B2A86" text-anchor="middle" letter-spacing=".5">CUÁNTO APOYA</text></g><g class="a-ap" style="--d:.15s"><rect x="150" y="557" width="792" height="6" rx="3" fill="url(#ejeg)"/><path d="M936 550 L952 560 L936 570z" fill="#5B2A86"/><text x="550.0" y="588" font-size="17" font-weight="800" fill="#5B2A86" text-anchor="middle" letter-spacing=".5">CUÁNTO DIRIGE</text></g><g class="a-ap" style="--d:0.40s"><rect x="570" y="300" width="380" height="236" rx="20" fill="#fff" filter="url(#sombra)"/><rect x="571" y="301" width="378" height="234" rx="19" fill="none" stroke="#F0731E" stroke-opacity=".45" stroke-width="2"/><circle cx="607" cy="341" r="19" fill="#F0731E"/><text x="607" y="348" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="638" y="349" font-size="28" font-weight="800" fill="#F0731E">Dirigir</text><circle cx="910" cy="342" r="22" fill="#F0731E" fill-opacity=".1"/><path d="M899 342 H919 M912 334 L921 342 L912 350" stroke="#F0731E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="400" font-size="15" font-weight="600" fill="#1B1A4A">Para quien recién empieza la tarea y tiene</text><text x="590" y="421" font-size="15" font-weight="600" fill="#1B1A4A">ganas de aprender.</text><text x="590" y="490" font-size="13" font-weight="800" fill="#4A4870">Dirige</text><rect class="a-ap" style="--d:0.70s" x="648" y="480" width="24" height="11" rx="5.5" fill="#F0731E"/><rect class="a-ap" style="--d:0.78s" x="677" y="480" width="24" height="11" rx="5.5" fill="#F0731E"/><rect class="a-ap" style="--d:0.86s" x="706" y="480" width="24" height="11" rx="5.5" fill="#F0731E"/><rect class="a-ap" style="--d:0.94s" x="735" y="480" width="24" height="11" rx="5.5" fill="#F0731E"/><text x="590" y="514" font-size="13" font-weight="800" fill="#4A4870">Apoya</text><rect class="a-ap" style="--d:0.85s" x="648" y="504" width="24" height="11" rx="5.5" fill="#F0731E"/><rect class="a-ap" style="--d:0.93s" x="677" y="504" width="24" height="11" rx="5.5" fill="#E6E0F3"/><rect class="a-ap" style="--d:1.01s" x="706" y="504" width="24" height="11" rx="5.5" fill="#E6E0F3"/><rect class="a-ap" style="--d:1.09s" x="735" y="504" width="24" height="11" rx="5.5" fill="#E6E0F3"/></g><g class="a-ap" style="--d:0.95s"><rect x="570" y="24" width="380" height="236" rx="20" fill="#fff" filter="url(#sombra)"/><rect x="571" y="25" width="378" height="234" rx="19" fill="none" stroke="#B83A7A" stroke-opacity=".45" stroke-width="2"/><circle cx="607" cy="65" r="19" fill="#B83A7A"/><text x="607" y="72" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="638" y="73" font-size="28" font-weight="800" fill="#B83A7A">Entrenar</text><circle cx="910" cy="66" r="22" fill="#B83A7A" fill-opacity=".1"/><path d="M898 57 h24 a3 3 0 0 1 3 3 v11 a3 3 0 0 1 -3 3 h-14 l-7 6 v-6 h-3 a3 3 0 0 1 -3 -3 v-11 a3 3 0 0 1 3 -3z" fill="none" stroke="#B83A7A" stroke-width="3" stroke-linejoin="round"/><path d="M904 64 h12 M904 70 h8" stroke="#B83A7A" stroke-width="2.5" stroke-linecap="round"/><text x="590" y="124" font-size="15" font-weight="600" fill="#1B1A4A">Para quien ya aprendió algo, pero todavía no</text><text x="590" y="145" font-size="15" font-weight="600" fill="#1B1A4A">domina la tarea y se desanima.</text><text x="590" y="214" font-size="13" font-weight="800" fill="#4A4870">Dirige</text><rect class="a-ap" style="--d:1.25s" x="648" y="204" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.33s" x="677" y="204" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.41s" x="706" y="204" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.49s" x="735" y="204" width="24" height="11" rx="5.5" fill="#B83A7A"/><text x="590" y="238" font-size="13" font-weight="800" fill="#4A4870">Apoya</text><rect class="a-ap" style="--d:1.40s" x="648" y="228" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.48s" x="677" y="228" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.56s" x="706" y="228" width="24" height="11" rx="5.5" fill="#B83A7A"/><rect class="a-ap" style="--d:1.64s" x="735" y="228" width="24" height="11" rx="5.5" fill="#B83A7A"/></g><g class="a-ap" style="--d:1.50s"><rect x="150" y="24" width="380" height="236" rx="20" fill="#fff" filter="url(#sombra)"/><rect x="151" y="25" width="378" height="234" rx="19" fill="none" stroke="#4B4FA3" stroke-op