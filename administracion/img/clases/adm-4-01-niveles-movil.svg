<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1040" role="img" aria-label="Escalera de cuatro escalones con la misma persona subiendo. Nivel 1: sabe poco y tiene ganas, conviene dirigir. Nivel 2: sabe algo y se desanima, conviene entrenar. Nivel 3: sabe hacerla y duda de sí, conviene apoyar. Nivel 4: la domina y tiene confianza, conviene delegar." font-family="'Plus Jakarta Sans', system-ui, sans-serif"><rect width="500" height="1040" rx="24" fill="#F7F4FD"/><g class="a-ap" style="--d:0s"><path d="M30 40 L30 1000" stroke="#5B2A86" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M20 1000 L30 1020 L40 1000Z" fill="#5B2A86"/></g><g class="a-ap" style="--d:0.20s"><rect x="56" y="30" width="420" height="226" rx="18" fill="#fff" stroke="#F0731E" stroke-width="4"/><image href="img/clases/adm-4-01-nivel1.webp" x="66" y="38" width="170" height="212" preserveAspectRatio="xMidYMid meet"/><text x="258" y="96" font-size="26" font-weight="800" fill="#F0731E" text-anchor="start">Nivel 1</text><text x="258" y="132" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe poco</text><text x="258" y="162" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Tiene ganas</text><rect x="258" y="182" width="130" height="38" rx="19" fill="#F0731E"/><text x="323" y="208" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Dirigir</text></g><g class="a-ap" style="--d:0.70s"><rect x="56" y="280" width="420" height="226" rx="18" fill="#fff" stroke="#B83A7A" stroke-width="4"/><image href="img/clases/adm-4-01-nivel2.webp" x="66" y="288" width="170" height="212" preserveAspectRatio="xMidYMid meet"/><text x="258" y="346" font-size="26" font-weight="800" fill="#B83A7A" text-anchor="start">Nivel 2</text><text x="258" y="382" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe algo</text><text x="258" y="412" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Se desanima</text><rect x="258" y="432" width="144" height="38" rx="19" fill="#B83A7A"/><text x="330" y="458" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Entrenar</text></g><g class="a-ap" style="--d:1.20s"><rect x="56" y="530" width="420" height="226" rx="18" fill="#fff" stroke="#4B4FA3" stroke-width="4"/><image href="img/clases/adm-4-01-nivel3.webp" x="66" y="538" width="170" height="212" preserveAspectRatio="xMidYMid meet"/><text x="258" y="596" font-size="26" font-weight="800" fill="#4B4FA3" text-anchor="start">Nivel 3</text><text x="258" y="632" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe hacerla</text><text x="258" y="662" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Duda de sí</text><rect x="258" y="682" width="116" height="38" rx="19" fill="#4B4FA3"/><text x="316" y="708" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Apoyar</text></g><g class="a-ap" style="--d:1.70s"><rect x="56" y="780" width="420" height="226" rx="18" fill="#fff" stroke="#5B2A86" stroke-width="4"/><image href="img/clases/adm-4-01-nivel4.webp" x="66" y="788" width="170" height="212" preserveAspectRatio="xMidYMid meet"/><text x="258" y="846" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="start">Nivel 4</text><text x="258" y="882" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">La domina</text><text x="258" y="912" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="start">Tiene confianza</text><rect x="258" y="932" width="130" height="38" rx="19" fill="#5B2A86"/><text x="323" y="958" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Delegar</text></g></svg>