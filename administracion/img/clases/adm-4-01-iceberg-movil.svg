<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 930" role="img" aria-label="Iceberg en el mar. Arriba del agua, lo que se ve: artefactos y conductas. Justo debajo del agua, lo que se dice: valores declarados. En lo profundo, lo que se da por hecho: supuestos básicos." font-family="'Plus Jakarta Sans', system-ui, sans-serif"><clipPath id="ic"><rect width="600" height="375" rx="24"/></clipPath><g clip-path="url(#ic)"><image href="img/clases/adm-4-01-iceberg.webp" width="600" height="375"/></g><g class="a-ap" style="--d:0.4s"><circle cx="295" cy="69" r="17" fill="#F0731E" stroke="#fff" stroke-width="3"/><text x="295" y="76" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="10" y="400" width="580" height="160" rx="18" fill="#fff" stroke="#F0731E" stroke-width="4"/><circle cx="46" cy="440" r="18" fill="#F0731E"/><text x="46" y="447" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="78" y="448" font-size="26" font-weight="800" fill="#F0731E" text-anchor="start">Lo que se ve</text><text x="78" y="480" font-size="20" font-weight="800" fill="#1B1A4A" text-anchor="start">Artefactos y conductas</text><text x="30" y="516" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">Uniformes, el lugar, los rituales</text><text x="30" y="542" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">y la forma de hablar.</text></g><g class="a-ap" style="--d:1.0s"><circle cx="323" cy="138" r="17" fill="#B83A7A" stroke="#fff" stroke-width="3"/><text x="323" y="145" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><rect x="10" y="575" width="580" height="160" rx="18" fill="#fff" stroke="#B83A7A" stroke-width="4"/><circle cx="46" cy="615" r="18" fill="#B83A7A"/><text x="46" y="622" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="78" y="623" font-size="26" font-weight="800" fill="#B83A7A" text-anchor="start">Lo que se dice</text><text x="78" y="655" font-size="20" font-weight="800" fill="#1B1A4A" text-anchor="start">Valores declarados</text><text x="30" y="691" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">Carteles, reglamentos</text><text x="30" y="717" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">y discursos.</text></g><g class="a-ap" style="--d:1.6s"><circle cx="291" cy="277" r="17" fill="#5B2A86" stroke="#fff" stroke-width="3"/><text x="291" y="284" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><rect x="10" y="750" width="580" height="160" rx="18" fill="#fff" stroke="#5B2A86" stroke-width="4"/><circle cx="46" cy="790" r="18" fill="#5B2A86"/><text x="46" y="797" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="78" y="798" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="start">Lo que se da por hecho</text><text x="78" y="830" font-size="20" font-weight="800" fill="#1B1A4A" text-anchor="start">Supuestos básicos</text><text x="30" y="866" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">Creencias que nadie discute</text><text x="30" y="892" font-size="19" font-weight="700" fill="#4A4870" text-anchor="start">y que guían lo que se hace.</text></g></svg>