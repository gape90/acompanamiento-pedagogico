<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-label="Escalera de cuatro escalones con la misma persona subiendo. Nivel 1: sabe poco y tiene ganas, conviene dirigir. Nivel 2: sabe algo y se desanima, conviene entrenar. Nivel 3: sabe hacerla y duda de sí, conviene apoyar. Nivel 4: la domina y tiene confianza, conviene delegar." font-family="'Plus Jakarta Sans', system-ui, sans-serif"><rect width="1000" height="670" rx="24" fill="#F7F4FD"/><g class="a-ap" style="--d:0.20s"><rect x="30" y="470" width="226" height="180" rx="16" fill="#fff" stroke="#F0731E" stroke-width="4"/><text x="50" y="506" font-size="22" font-weight="800" fill="#F0731E" text-anchor="start">Nivel 1</text><text x="50" y="534" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe poco</text><text x="50" y="558" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Tiene ganas</text><rect x="50" y="574" width="114" height="32" rx="16" fill="#F0731E"/><text x="107" y="596" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Dirigir</text><image href="img/clases/adm-4-01-nivel1.webp" x="33" y="224" width="220" height="250" preserveAspectRatio="xMidYMax meet"/></g><g class="a-ap" style="--d:0.80s"><rect x="270" y="408" width="226" height="242" rx="16" fill="#fff" stroke="#B83A7A" stroke-width="4"/><text x="290" y="444" font-size="22" font-weight="800" fill="#B83A7A" text-anchor="start">Nivel 2</text><text x="290" y="472" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe algo</text><text x="290" y="496" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Se desanima</text><rect x="290" y="512" width="126" height="32" rx="16" fill="#B83A7A"/><text x="353" y="534" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Entrenar</text><image href="img/clases/adm-4-01-nivel2.webp" x="273" y="162" width="220" height="250" preserveAspectRatio="xMidYMax meet"/></g><g class="a-ap" style="--d:1.40s"><rect x="510" y="346" width="226" height="304" rx="16" fill="#fff" stroke="#4B4FA3" stroke-width="4"/><text x="530" y="382" font-size="22" font-weight="800" fill="#4B4FA3" text-anchor="start">Nivel 3</text><text x="530" y="410" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Sabe hacerla</text><text x="530" y="434" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Duda de sí</text><rect x="530" y="450" width="102" height="32" rx="16" fill="#4B4FA3"/><text x="581" y="472" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Apoyar</text><image href="img/clases/adm-4-01-nivel3.webp" x="513" y="100" width="220" height="250" preserveAspectRatio="xMidYMax meet"/></g><g class="a-ap" style="--d:2.00s"><rect x="750" y="284" width="226" height="366" rx="16" fill="#fff" stroke="#5B2A86" stroke-width="4"/><text x="770" y="320" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="start">Nivel 4</text><text x="770" y="348" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">La domina</text><text x="770" y="372" font-size="17" font-weight="700" fill="#1B1A4A" text-anchor="start">Tiene confianza</text><rect x="770" y="388" width="114" height="32" rx="16" fill="#5B2A86"/><text x="827" y="410" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Delegar</text><image href="img/clases/adm-4-01-nivel4.webp" x="753" y="38" width="220" height="250" preserveAspectRatio="xMidYMax meet"/></g><g class="a-ap" style="--d:2.8s"><path d="M60 30 L880 30" stroke="#5B2A86" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M880 20 L900 30 L880 40Z" fill="#5B2A86"/><rect x="270" y="10" width="400" height="40" fill="#F7F4FD"/><text x="470" y="37" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="middle">Mientras aprende la tarea, cambia lo que necesita</text></g></svg>