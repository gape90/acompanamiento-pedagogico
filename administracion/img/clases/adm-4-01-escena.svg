<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1586 992" role="img" font-family="'Plus Jakarta Sans', system-ui, sans-serif" aria-label="Sala del equipo de e-sports del club. En la pared hay un cartel que dice: respetamos a los rivales, ganemos o perdamos; un corcho con el reglamento, cuyo artículo 3 dice que las decisiones importantes se votan; una pizarra con el título revisión de la fecha, qué aprendimos; y un trofeo. Dos jugadores con la misma camiseta chocan los puños. En una mesa, una jugadora le cuenta algo a un compañero. A la derecha, una integrante del equipo le explica algo en la notebook a un chico nuevo de buzo verde."><image href="img/clases/adm-4-01-escena.webp" width="1586" height="992"/><text x="255" y="200" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="middle">Respetamos</text><text x="255" y="230" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="middle">a los rivales,</text><text x="255" y="268" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="middle">ganemos o</text><text x="255" y="294" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="middle">perdamos.</text><rect x="404" y="186" width="78" height="114" fill="#fff"/><text x="443" y="206" font-size="11.5" font-weight="800" fill="#5B2A86" text-anchor="middle">Reglamento</text><text x="410" y="228" font-size="10.5" font-weight="700" fill="#4A4870" text-anchor="start">Art. 3: las</text><text x="410" y="243" font-size="10.5" font-weight="700" fill="#4A4870" text-anchor="start">decisiones</text><text x="410" y="258" font-size="10.5" font-weight="700" fill="#4A4870" text-anchor="start">importantes</text><text x="410" y="273" font-size="10.5" font-weight="700" fill="#4A4870" text-anchor="start">se votan.</text><text x="828" y="240" font-size="38" font-weight="800" fill="#3a46a8" text-anchor="middle">Revisión de la fecha</text><text x="828" y="296" font-size="32" font-weight="700" fill="#b8326f" text-anchor="middle">¿Qué aprendimos?</text><path d="M680 330 q30 -6 60 0 t60 0 t60 0 M680 362 q30 -6 60 0 t60 0" stroke="#7d86c9" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/></svg>