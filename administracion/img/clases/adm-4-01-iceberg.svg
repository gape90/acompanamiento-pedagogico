<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 813" role="img" aria-label="Iceberg en el mar. Arriba del agua, lo que se ve: artefactos y conductas. Justo debajo del agua, lo que se dice: valores declarados. En lo profundo, lo que se da por hecho: supuestos básicos." font-family="'Plus Jakarta Sans', system-ui, sans-serif"><clipPath id="ic"><rect width="1300" height="813" rx="24"/></clipPath><g clip-path="url(#ic)"><image href="img/clases/adm-4-01-iceberg.webp" width="1300" height="813"/><rect y="200" width="1300" height="8" fill="#fff" opacity=".35"><animate attributeName="opacity" values=".15;.45;.15" dur="4s" repeatCount="indefinite" class="a-vida"/></rect></g><g class="a-ap" style="--d:0.5s"><path d="M640 150 L960 125" stroke="#fff" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/><circle cx="640" cy="150" r="18" fill="#F0731E" stroke="#fff" stroke-width="4"/><text x="640" y="157" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="960" y="40" width="320" height="170" rx="20" fill="#fff" fill-opacity=".95" stroke="#F0731E" stroke-width="4"/><text x="985" y="80" font-size="24" font-weight="800" fill="#F0731E" text-anchor="start">Lo que se ve</text><text x="985" y="112" font-size="18" font-weight="800" fill="#1B1A4A" text-anchor="start">Artefactos y conductas</text><text x="985" y="148" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">Uniformes, el lugar, los rituales</text><text x="985" y="172" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">y la forma de hablar.</text></g><g class="a-ap" style="--d:1.3s"><path d="M700 300 L960 355" stroke="#fff" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/><circle cx="700" cy="300" r="18" fill="#B83A7A" stroke="#fff" stroke-width="4"/><text x="700" y="307" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><rect x="960" y="270" width="320" height="170" rx="20" fill="#fff" fill-opacity=".95" stroke="#B83A7A" stroke-width="4"/><text x="985" y="310" font-size="24" font-weight="800" fill="#B83A7A" text-anchor="start">Lo que se dice</text><text x="985" y="342" font-size="18" font-weight="800" fill="#1B1A4A" text-anchor="start">Valores declarados</text><text x="985" y="378" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">Carteles, reglamentos</text><text x="985" y="402" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">y discursos.</text></g><g class="a-ap" style="--d:2.1s"><path d="M630 600 L960 625" stroke="#fff" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"/><circle cx="630" cy="600" r="18" fill="#5B2A86" stroke="#fff" stroke-width="4"/><text x="630" y="607" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><rect x="960" y="540" width="320" height="170" rx="20" fill="#fff" fill-opacity=".95" stroke="#5B2A86" stroke-width="4"/><text x="985" y="580" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="start">Lo que se da por hecho</text><text x="985" y="612" font-size="18" font-weight="800" fill="#1B1A4A" text-anchor="start">Supuestos básicos</text><text x="985" y="648" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">Creencias que nadie discute</text><text x="985" y="672" font-size="16" font-weight="700" fill="#4A4870" text-anchor="start">y que guían lo que se hace.</text></g></svg>